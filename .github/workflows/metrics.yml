name: Metrics

on:
  schedule:
    - cron: "16 */8 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/metrics.yml"
      - "README.md"

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
          - name: Generar calendario isometrico
            uses: lowlighter/metrics@latest
            with:
              filename: isocalendar.svg
              token: ${{ secrets.METRICS_TOKEN }}
              user: soynegativ0
              base: ""
              config_timezone: Europe/Barcelona
              plugin_isocalendar: yes
              plugin_isocalendar_duration: full-year

          - name: Cambiar textos azules por morado en isocalendar.svg
            run: |
              git pull origin main
              sed -i 's/#0366d6/#bd93f9/gI; s/#58a6ff/#bd93f9/gI; s/#2f81f7/#bd93f9/gI' isocalendar.svg
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -am "Aplicar color morado a isocalendar" || true
              git push